
<footer class="allea-footer" id="nosotras">

  <!-- TRANSICIÓN CURVA SUPERIOR -->
  <div class="footer-curve" aria-hidden="true">

    <svg
      viewBox="0 0 1440 150"
      preserveAspectRatio="none">

      <path
        d="M0,0 H1440 V20
           C1100,20 1000,150 720,150
           C440,150 340,20 0,20 Z">
      </path>

    </svg>

  </div>

  <!-- FOTOGRAFÍA -->
  <div class="footer-background"></div>

  <!-- CAPA OSCURA -->
  <div class="footer-overlay"></div>

  <!-- CONTENIDO -->
  <div class="footer-content">

    <span class="footer-label">
      ACTIVEWEAR · ALLÉA
    </span>

    <h2>ALLÉA</h2>

    <p class="footer-phrase">
      MOVIMIENTO, ESTILO Y ACTITUD.
    </p>

    <!-- INSTAGRAM CENTRADO -->
    <div class="social-links">

      <a
        [href]="instagramUrl()"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram de ALLÉA">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round">

          <rect
            x="2"
            y="2"
            width="20"
            height="20"
            rx="5"
            ry="5">
          </rect>

          <circle
            cx="12"
            cy="12"
            r="4">
          </circle>

          <circle
            cx="18"
            cy="6"
            r="1"
            fill="currentColor"
            stroke="none">
          </circle>

        </svg>

      </a>

    </div>

    <!-- COPYRIGHT -->
    <div class="footer-bottom">

      <span>
        © {{ currentYear }} ALLÉA
      </span>

      <span>
        TODOS LOS DERECHOS RESERVADOS
      </span>

    </div>

  </div>

</footer>
